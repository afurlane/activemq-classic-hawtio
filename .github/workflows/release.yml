name: Release

on:
  workflow_run:
    workflows: ["Green Checks"]
    types:
      - completed

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'master' }}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
        
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Release Please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          release-type: simple
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Set up JDK
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set Maven version from tag
        if: ${{ steps.release.outputs.release_created }}
        run: |
          VERSION="${{ steps.release.outputs.tag_name }}"
          VERSION="${VERSION#v}"
          mvn -B versions:set -DnewVersion="$VERSION"

      - name: Build plugin
        if: ${{ steps.release.outputs.release_created }}
        run: mvn -B clean package

      - name: Upload JAR to Release
        if: ${{ steps.release.outputs.release_created }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.release.outputs.tag_name }}" \
            "target/activemq-classic-hawtio-*.jar" \
            --clobber
      - name: Build NPM package
        if: ${{ steps.release.outputs.release_created }}
        working-directory: frontend
        run: npm pack

      - name: Validate NPM package
        if: ${{ steps.release.outputs.release_created }}
        working-directory: frontend
        run: |
          tar -tf *.tgz

      - name: Upload NPM package to Release
        if: ${{ steps.release.outputs.release_created }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: frontend
        run: |
          PKG=$(ls *.tgz)
          gh release upload "${{ steps.release.outputs.tag_name }}" \
            "$PKG" \
            --clobber

      - name: Close related issues
        if: ${{ steps.release.outputs.release_created }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
          RELEASE_BRANCH: master
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.release.outputs.tag_name }}
        run: |
          set -euo pipefail

          RELEASE_NOTES="$(gh release view "$RELEASE_TAG" --json body --jq '.body // ""')"
          ISSUE_NUMBERS="$(printf '%s\n' "$RELEASE_NOTES" | perl -ne 'while (/(?i)\b(?:close[sd]?|fix(?:es|ed)?|resolve[sd]?)\b[^0-9#]*#?\[?(\d+)\]?/g) { print "$1\n" }' | sort -u)"

          if [ -z "$ISSUE_NUMBERS" ]; then
            echo "No related issues found in release notes."
            exit 0
          fi

          for issue_number in $ISSUE_NUMBERS; do
            issue_state="$(gh issue view "$issue_number" --json state --jq '.state')"
            if [ "$issue_state" = "OPEN" ]; then
              gh issue close "$issue_number" --comment "Closed in $RELEASE_TAG ($RELEASE_BRANCH): $RELEASE_URL"
            else
              gh issue comment "$issue_number" --body "Mentioned in $RELEASE_TAG ($RELEASE_BRANCH): $RELEASE_URL"
            fi
          done

      - name: Update README badge
        if: ${{ steps.release.outputs.release_created }}
        env:
          TAG: ${{ steps.release.outputs.tag_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sed -i "s|latest-release-.*-blue|latest-release-${TAG}-blue|g" README.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update release badge to ${TAG}" || echo "No changes"
          git push

  publish-green-checks:
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v7
        with:
          ref: gh-pages

      - name: Download green reports artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download ${{ github.event.workflow_run.id }} \
            --name green-checks \
            --dir .

      - name: Commit and push updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports badges
          git commit -m "docs: update green checks for ${{ needs.release.outputs.tag_name }}" || echo "No changes"
          git push origin gh-pages

  sonar-analysis:
    name: SonarQube Quality Scan
    runs-on: ubuntu-latest
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Download SonarScanner CLI
        run: |
          curl -sSLo sonar.zip https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-8.0.1.6346-linux-x64.zip
          unzip sonar.zip
          mv sonar-scanner-* sonar-scanner
          echo "$PWD/sonar-scanner/bin" >> $GITHUB_PATH

      - name: Install frontend deps
        run: |
          cd frontend
          yarn install --frozen-lockfile

      - name: Build backend (Java)
        run: mvn -B clean compile        

      - name: Run SonarQube Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_URL: ${{ secrets.SONAR_URL }}
        run: |
          SONAR_JAVA_LIBS="${HOME}/.m2/repository/**/*.jar"

          sonar-scanner \
            -Dsonar.projectKey=activemq-classic-hawtio \
            -Dsonar.projectName="ActiveMQ Classic Hawtio Plugin" \
            -Dsonar.sources=src/main/java,frontend/src \
            -Dsonar.java.binaries=target/classes \
            -Dsonar.java.libraries="$SONAR_JAVA_LIBS" \
            -Dsonar.scanner.javaExePath="$JAVA_HOME/bin/java" \
            -Dsonar.branch.name=${{ github.event.workflow_run.head_branch }} \
            -Dsonar.host.url=$SONAR_URL \
            -Dsonar.token=$SONAR_TOKEN
