name: Build & Quality Checks 1.0

on:
  push:
    branches: [ "1.0" ]
  pull_request:
    branches: [ "1.0" ]
    types: [opened, synchronize, reopened]
    
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

    steps:
      - name: Cache Maven
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Dependency-Check DB
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/dependency-check
            ~/.m2/repository/org/owasp/dependency-check-data
          key: dc-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            dc-${{ runner.os }}-

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Build plugin (Maven)
        run: ./mvnw -B clean install

      - name: Audit FE dependencies 
        run: |
          cd frontend
          yarn npm audit --environment production || true

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v7
        with:
          name: activemq-classic-plugin-1.0
          path: target/*.jar

  sonar-analysis:
    name: SonarQube Quality Scan
    runs-on: ubuntu-latest
    needs: build
    if: ${{ needs.build.result == 'success' }}
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.ref_name }}
          fetch-depth: 0
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Download SonarScanner CLI
        run: |
          curl -sSLo sonar.zip https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-8.0.1.6346-linux-x64.zip
          unzip sonar.zip
          mv sonar-scanner-* sonar-scanner
          echo "$PWD/sonar-scanner/bin" >> $GITHUB_PATH

      - name: Install frontend deps
        run: |
          cd frontend
          yarn install --frozen-lockfile

      - name: Build backend (Java)
        run: mvn -B clean compile        

      - name: Run SonarQube Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_URL: ${{ secrets.SONAR_URL }}
        run: |
          sonar-scanner \
            -Dsonar.projectKey=activemq-classic-hawtio \
            -Dsonar.projectName="ActiveMQ Classic Hawtio Plugin" \
            -Dsonar.sources=src/main/java,frontend/src \
            -Dsonar.java.binaries=target/classes \
            -Dsonar.branch.name=${{ github.ref_name }} \
            -Dsonar.host.url=$SONAR_URL \
            -Dsonar.login=$SONAR_TOKEN
