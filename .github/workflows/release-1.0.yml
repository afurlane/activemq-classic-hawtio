name: Release 1.0

on:
  workflow_run:
    workflows: ["Green Checks 1.0"]
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == '1.0' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Detect releasable commits
        id: releasable
        run: |
          git fetch --tags --force
          LAST_RELEASE_COMMIT=$(git log --grep='^chore([^)]*): release ' --format=%H -n 1 || true)
          LAST_TAG=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)

          if [[ -n "$LAST_RELEASE_COMMIT" ]]; then
            RANGE="$LAST_RELEASE_COMMIT..HEAD"
          elif [[ -n "$LAST_TAG" ]]; then
            RANGE="$LAST_TAG..HEAD"
          else
            RANGE="HEAD"
          fi

          echo "Using commit range: $RANGE"
          git log --format=%s "$RANGE" | cat

          if git log --format=%s "$RANGE" | grep -Eq '^(feat|fix|perf|revert|deps)(\(.+\))?(!)?:'; then
            echo "has_releasable=true" >> "$GITHUB_OUTPUT"
            echo "Releasable commits found."
          else
            echo "has_releasable=false" >> "$GITHUB_OUTPUT"
            echo "No releasable commits found since the last release baseline; skipping release-please."
          fi

      - name: Release Please
        id: release
        if: ${{ steps.releasable.outputs.has_releasable == 'true' }}
        uses: googleapis/release-please-action@v5
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Set up JDK
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set Maven version from tag
        if: ${{ steps.release.outputs.release_created }}
        run: |
          VERSION="${{ steps.release.outputs.tag_name }}"
          VERSION="${VERSION#v}"
          mvn -B versions:set -DnewVersion="$VERSION"

      - name: Build plugin
        if: ${{ steps.release.outputs.release_created }}
        run: mvn -B clean package

      - name: Upload JAR to Release
        if: ${{ steps.release.outputs.release_created }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.release.outputs.tag_name }}" \
            "target/activemq-classic-hawtio-*.jar" \
            --clobber

  sonar-analysis:
    name: SonarQube Quality Scan
    runs-on: ubuntu-latest
    needs: release
    if: ${{ needs.release.outputs.release_created }}
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Download SonarScanner CLI
        run: |
          curl -sSLo sonar.zip https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-8.0.1.6346-linux-x64.zip
          unzip sonar.zip
          mv sonar-scanner-* sonar-scanner
          echo "$PWD/sonar-scanner/bin" >> $GITHUB_PATH

      - name: Install frontend deps
        run: |
          cd frontend
          yarn install --frozen-lockfile

      - name: Build backend (Java)
        run: mvn -B clean compile        

      - name: Run SonarQube Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_URL: ${{ secrets.SONAR_URL }}
        run: |
          SONAR_JAVA_LIBS="${HOME}/.m2/repository/**/*.jar"

          sonar-scanner \
            -Dsonar.projectKey=activemq-classic-hawtio \
            -Dsonar.projectName="ActiveMQ Classic Hawtio Plugin" \
            -Dsonar.sources=src/main/java,frontend/src \
            -Dsonar.java.binaries=target/classes \
            -Dsonar.java.libraries="$SONAR_JAVA_LIBS" \
            -Dsonar.scanner.javaExePath="$JAVA_HOME/bin/java" \
            -Dsonar.branch.name=${{ github.event.workflow_run.head_branch }} \
            -Dsonar.host.url=$SONAR_URL \
            -Dsonar.token=$SONAR_TOKEN
