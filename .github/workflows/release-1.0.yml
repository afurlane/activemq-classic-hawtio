name: Release (1.0)

on:
  workflow_run:
    workflows: ["Green Checks (1.0)"]
    types:
      - completed

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release:
    runs-on: ubuntu-latest

    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == '1.0' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Release Please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          release-type: simple
          target-branch: "1.0"
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Set up JDK
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set Maven version from tag
        if: ${{ steps.release.outputs.release_created }}
        run: |
          VERSION="${{ steps.release.outputs.tag_name }}"
          VERSION="${VERSION#v}"
          mvn -B versions:set -DnewVersion="$VERSION"

      - name: Build plugin
        if: ${{ steps.release.outputs.release_created }}
        run: mvn -B clean package

      - name: Upload JAR to Release
        if: ${{ steps.release.outputs.release_created }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.release.outputs.tag_name }}" \
            "target/activemq-classic-hawtio-*.jar" \
            --clobber

      - name: Close related issues
        if: ${{ steps.release.outputs.release_created }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
          RELEASE_BRANCH: 1.0
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.release.outputs.tag_name }}
        run: |
          set -euo pipefail

          RELEASE_NOTES="$(gh release view "$RELEASE_TAG" --json body --jq '.body // ""')"
          ISSUE_NUMBERS="$(printf '%s\n' "$RELEASE_NOTES" | perl -ne 'while (/(?i)\b(?:close[sd]?|fix(?:es|ed)?|resolve[sd]?)\b[^0-9#]*#?\[?(\d+)\]?/g) { print "$1\n" }' | sort -u)"

          if [ -z "$ISSUE_NUMBERS" ]; then
            echo "No related issues found in release notes."
            exit 0
          fi

          for issue_number in $ISSUE_NUMBERS; do
            issue_state="$(gh issue view "$issue_number" --json state --jq '.state')"
            if [ "$issue_state" = "OPEN" ]; then
              gh issue close "$issue_number" --comment "Closed in $RELEASE_TAG ($RELEASE_BRANCH): $RELEASE_URL"
            else
              gh issue comment "$issue_number" --body "Mentioned in $RELEASE_TAG ($RELEASE_BRANCH): $RELEASE_URL"
            fi
          done
